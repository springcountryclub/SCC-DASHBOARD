<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SCC Board">
<title>SCC Sales Board</title>
<link rel="icon" href="logo.svg">
<link rel="apple-touch-icon" href="logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kumbh+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--header:#5E877A;--accent:#4F7468;--gold:#847D3D;--bg:#F2F2F2;--surface:#fff;--border:#E1E6E4;--fg:#333;--fg2:#5F6663;--fg3:#8A938F;--red:#B5483F;--green:#3F7A57;--ltgreen:#EAF1EE;--ltgold:#F4F1E2;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--header:#3F5F55;--accent:#9BC0B4;--gold:#B3A964;--bg:#1B201F;--surface:#252B29;--border:#36403D;--fg:#ECEFEE;--fg2:#B3BDB9;--fg3:#808B87;--red:#E28A80;--green:#8CC39E;--ltgreen:#22302B;--ltgold:#2E2C1D;color-scheme:dark}}
*{box-sizing:border-box;margin:0}
body{font-family:'Kumbh Sans',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--fg);-webkit-font-smoothing:antialiased}
header{background:var(--header);color:#fff;padding:14px 16px}
.wrap{max-width:1040px;margin:0 auto;padding:0 16px}
header .wrap{display:flex;align-items:center;gap:12px;padding:0}
header svg{width:40px;height:40px;color:#fff;flex:none}
.brand b{display:block;letter-spacing:.18em;font-size:14px;font-weight:600;text-transform:uppercase}
.brand span{font-size:12px;opacity:.85;letter-spacing:.12em;text-transform:uppercase}
.upd{margin-left:auto;font-size:12px;background:rgba(255,255,255,.16);padding:6px 10px;border-radius:999px;white-space:nowrap}
.hero{margin:18px auto;padding:20px 22px;border-radius:16px;background:var(--accent);color:#fff}
@media (prefers-color-scheme:dark){.hero{background:#3F5F55}}
.k{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;opacity:.85}
.big{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-top:6px}
.big b{font-size:44px;font-weight:800;line-height:1}
.big span{font-size:15px;opacity:.9}
.htrack{position:relative;height:14px;border-radius:7px;background:rgba(255,255,255,.2);margin:14px 0 8px}
.hfill{height:100%;border-radius:7px;background:#F2D36B}
.hmark{position:absolute;top:-5px;bottom:-5px;width:3px;background:#fff;border-radius:2px}
.hsub{font-size:14px;opacity:.95}
.hly{font-size:14px;opacity:.95;margin-top:8px;padding-top:8px;border-top:1px solid rgba(255,255,255,.2)}
.kpi{display:inline-flex;align-items:center;gap:8px;margin:2px 0 12px;padding:6px 14px 6px 8px;border-radius:999px;background:#fff;font-size:15px;font-weight:700;white-space:nowrap}
.kpi i{width:18px;height:18px;border-radius:50%;flex:none}
.kpi.g{color:#3F7A57}.kpi.g i{background:#3F7A57}
.kpi.y{color:#7E6A00;background:#FBF3D2}.kpi.y i{background:#E2B714}
.kpi.r{color:#B5483F;background:#F8EBE9}.kpi.r i{background:#B5483F}
.kpi.g{background:#EAF1EE}
.today-hero{margin-bottom:12px}
.sec-title{margin:30px 0 -6px;font-size:13px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.hero-grid{display:flex;gap:18px;align-items:stretch;flex-wrap:wrap}.hero-main{flex:1;min-width:260px}
.today-box{flex:none;min-width:200px;background:rgba(255,255,255,.14);border-radius:12px;padding:14px 18px;display:flex;flex-direction:column;justify-content:center}
.tb-n{font-size:40px;font-weight:800;line-height:1.05;margin-top:4px}.tb-s{font-size:13px;opacity:.9;margin-top:2px}
.tb-track{height:8px;border-radius:4px;background:rgba(255,255,255,.2);margin-top:8px}.tb-fill{height:100%;border-radius:4px;background:#F2D36B}
.tt-today{white-space:nowrap;display:inline-block;margin-top:4px;font-style:normal;font-size:14px;font-weight:700;color:var(--green);background:var(--ltgreen);padding:3px 10px;border-radius:999px;margin-left:8px;vertical-align:3px}
@media (max-width:600px){.today-box{width:100%}.tb-n{font-size:32px}}
.leads{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.lead{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.14);border-radius:12px;padding:10px 16px}
.lead svg{width:28px;height:28px;fill:none;stroke:#F2D36B;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.lk{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;opacity:.85}.ln{font-size:18px;font-weight:700}.ls{font-size:12px;opacity:.9}
.lastupd{margin:16px 0 -6px;font-size:14px;color:var(--fg2);display:flex;align-items:center;gap:8px}
.lastupd b{color:var(--fg)}.lastupd .dot{width:9px;height:9px;border-radius:50%;background:var(--green);flex:none}
.lastupd.old .dot{background:#E2B714}
.tl{display:flex;flex-direction:column;gap:6px}
.tl-row{display:grid;grid-template-columns:28px minmax(110px,1.2fr) auto minmax(80px,2fr) 96px;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:10px 14px}
.tl-row.lead1{border:2px solid var(--gold);background:var(--ltgold)}
.tl-r{font-weight:800;color:var(--fg3)}.tl-n{font-weight:700;font-size:18px}.tl-t{font-size:12px;font-weight:600;color:var(--fg2);background:var(--bg);padding:3px 9px;border-radius:999px}
.tl-bar{height:10px;border-radius:5px;background:var(--bg);overflow:hidden}.tl-bar span{display:block;height:100%;background:var(--green);border-radius:5px}
.tl-v{text-align:right;font-weight:800;font-size:20px;color:var(--green);font-variant-numeric:tabular-nums}
@media (max-width:600px){.tl-row{grid-template-columns:22px 1fr auto}.tl-t,.tl-bar{display:none}}
.team{margin:26px 0 12px}
.tk{font-size:13px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.tt{font-size:22px;font-weight:800;margin-top:2px}.tt span{font-size:14px;font-weight:500;color:var(--fg2)}
.ttrack{position:relative;height:10px;border-radius:5px;background:var(--surface);border:1px solid var(--border);margin-top:8px}
.tfill{height:100%;border-radius:5px;background:var(--gold)}
.tmark{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--fg);opacity:.6}
.rc{display:flex;gap:16px;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px 20px;margin-bottom:12px}
.rc.first{border:2px solid var(--gold);background:linear-gradient(90deg,var(--ltgold),var(--surface) 60%)}
.rank{flex:none;width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-size:24px;font-weight:800;background:var(--bg);color:var(--fg3)}
.rank.r1{background:#E2B714;color:#fff}.rank.r2{background:#A9B1AE;color:#fff}.rank.r3{background:#B07A4A;color:#fff}
.body{flex:1;min-width:0;display:flex;flex-direction:column;gap:7px}
.top{display:flex;align-items:baseline;gap:8px;justify-content:space-between}.top .name{min-width:0}.top .amt{flex:none}
.tags{display:flex;gap:6px;flex-wrap:wrap}.tags span{white-space:nowrap}
.name{font-size:26px;font-weight:700;line-height:1.1}
.amt{margin-left:auto;font-size:34px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.today{font-size:13px;font-weight:700;color:var(--green);background:var(--ltgreen);padding:3px 9px;border-radius:999px}
.else{font-size:12px;font-weight:600;color:var(--fg2);background:var(--bg);border:1px solid var(--border);padding:3px 9px;border-radius:999px}
.courts{font-size:13px;font-weight:700;color:#fff;background:var(--green);padding:3px 10px;border-radius:999px}
.cta{background:var(--ltgreen);border:1px solid var(--green);border-radius:12px;padding:12px 16px;font-size:15px;margin:2px 0 8px}
.track{position:relative;height:20px;border-radius:10px;background:var(--bg)}
.fill{height:100%;border-radius:10px;background:var(--red);min-width:8px;transition:width .6s}
.fill.ok{background:var(--green)}
.mark{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--fg);opacity:.55}
.sub{font-size:14px;color:var(--fg2)}.sub b{color:var(--fg)}
.foot{margin:20px auto 40px;font-size:13px;color:var(--fg3);text-align:center}
.empty{margin:40px 0;text-align:center;color:var(--fg2)}
@media (max-width:600px){.big b{font-size:34px}.rc{padding:12px 14px;gap:12px}.rank{width:40px;height:40px;font-size:19px}.name{font-size:20px}.amt{font-size:26px}.track{height:14px}.upd{display:none}}
.stk{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding-left:38px}
.sk{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;border:1.5px dashed var(--border);flex:none}
.sk svg{width:20px;height:20px;fill:none;stroke:var(--fg3);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;opacity:.45}
.sk.on{background:#4F7468;border:2px solid #fff;outline:1.5px solid #4F7468;box-shadow:0 2px 5px rgba(0,0,0,.2);transform:rotate(-7deg)}
.sk.on:nth-child(even){transform:rotate(6deg)}
.sk.on svg{stroke:#fff;opacity:1}
.stk-n{font-size:12px;font-weight:700;color:var(--fg2);margin-left:4px;white-space:nowrap}
@media (max-width:600px){.stk{padding-left:0;gap:4px}.sk{width:27px;height:27px}.sk svg{width:16px;height:16px}}
.legend{margin-top:10px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px}
.legend summary{cursor:pointer;font-weight:700;font-size:14px;color:var(--fg2)}
.lg-t{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin:12px 0 6px}
.lg{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px 12px}
.lg span{display:flex;align-items:center;gap:8px;font-size:14px}
.lg .sk{width:30px;height:30px}
.star{width:15px;height:15px;fill:#4F7468;vertical-align:-2px;margin-right:4px}
.stk-n.full{color:#4F7468}
.msk{margin-top:10px;padding-top:10px;border-top:1px solid var(--border)}
.msk-miss{margin-top:8px;font-size:13px;color:var(--fg2)}.msk-miss b{color:#4F7468}.msk-miss b{font-weight:700}
.msk-sets{color:#4F7468;font-size:14px;font-weight:800}
.msk-h{font-size:12px;font-weight:700;color:var(--fg2);margin-bottom:6px}.msk-full{color:#4F7468}
.stk.m{padding-left:0;gap:9px 10px;padding-top:4px}
.stk.m .sk{width:28px;height:28px}.stk.m .sk svg{width:16px;height:16px}.stk.m .sk.on,.stk.m .sk.on:nth-child(even){transform:none}
.stk.m .sk b{min-width:15px;height:15px;font-size:9px;line-height:12px;right:-7px;top:-6px}
.sk{position:relative}.sk b{position:absolute;right:-5px;top:-6px;min-width:17px;height:17px;padding:0 3px;border-radius:9px;background:#fff;color:#4F7468;border:1.5px solid #4F7468;font-size:10px;font-weight:800;line-height:14px;text-align:center}
.sk.on:nth-child(even) b,.sk.on b{transform:none}
.bronze .sk.on{background:#A2693F}.silver .sk.on{background:#8A959A}.gold .sk.on{background:#B48E2A}
.msk-done{font-weight:800;color:#4F7468}.msk-done.bronze{color:#A2693F}.msk-done.silver{color:#76838A}.msk-done.gold{color:#9C7A1F}
.tier-chip{display:inline-block;padding:0 8px;border-radius:999px;color:#fff;background:#4F7468;font-size:12px;font-weight:700}.tier-chip.bronze{background:#A2693F}.tier-chip.silver{background:#8A959A}.tier-chip.gold{background:#B48E2A}
.cbadge{display:inline-flex;align-items:center;gap:3px;margin-left:8px;vertical-align:middle;border-radius:999px;color:#fff;font-weight:800;line-height:1;white-space:nowrap}
.cbadge svg{fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.cbadge{padding:.25em .7em .25em .5em}.cbadge svg{stroke-width:1.6}
.cbadge.g{background:#4F7468}.cbadge.g rect{fill:#4F7468}
.cbadge.bronze{background:#A2693F}.cbadge.bronze rect{fill:#A2693F}
.cbadge.silver{background:linear-gradient(135deg,#9AA5AA,#6F7C82)}.cbadge.silver rect{fill:#7F8C92}
.cbadge.gold{background:linear-gradient(135deg,#D4B048,#A07E1C);box-shadow:0 0 0 3px rgba(212,176,72,.3),0 2px 8px rgba(160,126,28,.45)}.cbadge.gold rect{fill:#B8952F}
</style>
</head>
<body>
<header><div class="wrap">
  <svg viewBox="409 189 205 205" aria-hidden="true"><use href="logo.svg#m"></use></svg>
  <div class="brand"><b>The Spring Country Club</b><span>Sales Challenge</span></div>
  <div class="upd" id="upd">Loading…</div>
</div></header>
<main class="wrap">
  <div class="lastupd" id="lastupd"></div>
  <section class="hero today-hero" id="hero-today"></section>
  <div id="todaylist"></div>
  <div class="sec-title">The month · road to $150k</div>
  <section class="hero" id="hero"></section>
  <div id="teams"></div>
  <p class="foot">Updates automatically. Every guest: offer one more thing — a cart, a bucket, a drink, food with the drink.</p>
</main>
<script>
const $ = id => document.getElementById(id);
const fmt = n => '$' + Math.round(n).toLocaleString('en-US');
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
fetch('logo.svg').then(r => r.text()).then(t => { const svg = document.querySelector('header svg'); const m = t.match(/<path[\s\S]*?\/>/g); if (m) svg.innerHTML = m.join(''); svg.setAttribute('fill', 'currentColor'); }).catch(() => {});
let last = '';
async function load() {
  try {
    const r = await fetch('data.json?t=' + Date.now(), { cache: 'no-store' });
    const t = await r.text(); if (t === last) { stamp(JSON.parse(t)); return; } last = t;
    render(JSON.parse(t));
  } catch { $('upd').textContent = 'Offline — retrying'; }
}
function stamp(d) {
  if (!d.asOf) return; const a = new Date(d.asOf), mins = Math.round((Date.now() - a) / 60000);
  const ago = mins < 1 ? 'just now' : mins < 60 ? mins + ' min ago' : Math.floor(mins / 60) + ' h ' + (mins % 60) + ' min ago';
  const sameDay = a.toDateString() === new Date().toDateString();
  $('lastupd').className = 'lastupd' + (mins > 180 ? ' old' : '');
  $('lastupd').innerHTML = `<span class="dot"></span>Last update: <b>${sameDay ? 'today' : a.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' })} at ${a.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' })}</b> · ${ago}`;
  $('upd').textContent = 'Sales as of ' + a.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }) + (a.toDateString() !== new Date().toDateString() ? ' · ' + a.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) : '');
}
function kpi(d) {
  // same traffic light as the manager tracker: where sales should be by now (7 AM open → 9 PM close) vs where they are
  const tg = d.todayGoal || 0; if (!tg || d.today == null || !d.asOf) return '';
  const a = new Date(d.asOf), frac = Math.max(0, Math.min(1, (a.getHours() + a.getMinutes() / 60 - 7) / 14));
  const usd = n => '$' + Math.round(n).toLocaleString('en-US');
  if (d.today >= tg) return `<div class="kpi g"><i></i>Goal hit · ${usd(d.today - tg)} over</div>`;
  if (frac <= 0) return '';
  const exp = tg * frac, r = d.today / exp, c = r >= 1 ? 'g' : r >= 0.85 ? 'y' : 'r';
  return `<div class="kpi ${c}"><i></i>${r >= 1 ? `On pace · ${usd(d.today - exp)} ahead` : `${c === 'y' ? 'Close' : 'Behind'} · ${usd(exp - d.today)} short`}</div>`;
}
function lyLine(d) {
  if (!d.todayLY) return '';
  const day = d.lyDate ? new Date(d.lyDate + 'T12:00:00').toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' }) : 'same day';
  return `<div class="hly">Last year (${day}): <b>${fmt(d.todayLY)}</b> · ${d.today >= d.todayLY ? `<b>beat it by ${fmt(d.today - d.todayLY)}</b> 🎉` : `<b>${fmt(d.todayLY - d.today)}</b> to beat it`}</div>`;
}
function stkRow(d, p) {
  const c = d.cards && d.cards[p.card]; if (!c) return '';
  const g = new Set(p.got || []), n = c.filter(([k]) => g.has(k)).length;
  return `<div class="stk ${tierOf(p.cards)}">${c.map(([k, name, svg]) => `<span class="sk${g.has(k) ? ' on' : ''}" title="${esc(name)}"><svg viewBox="0 0 24 24" aria-hidden="true">${svg}</svg></span>`).join('')}<span class="stk-n${n === c.length ? ' full' : ''}">${n === c.length ? '<svg class="star" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.2l2.7 5.5 6 .9-4.35 4.25 1.03 6L12 17l-5.38 2.85 1.03-6L3.3 9.6l6-.9L12 3.2Z"/></svg>Perfect day!' : `${n}/${c.length} stickers`}</span></div>`;
}
function legend(d) {
  if (!d.cards) return '';
  const names = { rb: 'Range & Bar card', shop: 'Pro Shop card' };
  return `<details class="legend"><summary><svg class="star" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.2l2.7 5.5 6 .9-4.35 4.25 1.03 6L12 17l-5.38 2.85 1.03-6L3.3 9.6l6-.9L12 3.2Z"/></svg>How to collect stickers: sell one of each, every day</summary>${Object.entries(d.cards).map(([k, c]) => `<div class="lg-t">${names[k] || k}</div><div class="lg">${c.map(([, name, svg]) => `<span><i class="sk on"><svg viewBox="0 0 24 24" aria-hidden="true">${svg}</svg></i>${esc(name)}</span>`).join('')}</div>`).join('')}<div class="lg-t">${STAR}Perfect day</div><div style="font-size:14px">All 10 in one day. Today's card starts fresh every morning.</div><div class="lg-t">Cards</div><div style="font-size:14px">Your month card fills up as you earn each sticker. Fill all 10 and it's <b>complete</b>: you get a new empty card and start again. Complete cards change your sticker color: <span class="tier-chip">green</span> → <span class="tier-chip bronze">bronze</span> at 5 complete cards → <span class="tier-chip silver">silver</span> at 8 → <span class="tier-chip gold">gold</span> at 12.</div></details>`;
}
const tierOf = n => (n || 0) >= 12 ? 'gold' : n >= 8 ? 'silver' : n >= 5 ? 'bronze' : '';   // complete cards needed for each sticker color
function monthStk(d, p) {
  const c = d.cards && d.cards[p.card]; if (!c || !p.sd) return '';
  const cur = new Set(p.cur || []), n = c.filter(([k]) => cur.has(k)).length, done = p.cards || 0, t = tierOf(done);
  const head = `<span class="msk-sets">Card ${done + 1} · ${n}/${c.length}</span>${done ? ` · <span class="msk-done ${t}">${done} card${done > 1 ? 's' : ''} complete</span>` : ''}${p.full ? ` · <span class="msk-full">${STAR}${p.full} perfect day${p.full > 1 ? 's' : ''}</span>` : ''}`;
  const icons = c.map(([k, name, svg]) => `<span class="sk${cur.has(k) ? ' on' : ''}" title="${esc(name)}"><svg viewBox="0 0 24 24" aria-hidden="true">${svg}</svg></span>`).join('');
  return `<div class="msk ${t}"><div class="msk-h">${head}</div><div class="stk m">${icons}</div><div class="msk-miss">${n === c.length ? 'Card complete!' : `Card ${done + 1} still needs: ${c.filter(([k]) => !cur.has(k)).map(([, name]) => `<b>${esc(name)}</b>`).join(' · ')}`}</div></div>`;
}
const STAR = '<svg class="star" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.2l2.7 5.5 6 .9-4.35 4.25 1.03 6L12 17l-5.38 2.85 1.03-6L3.3 9.6l6-.9L12 3.2Z"/></svg>';
const STARL = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.2l2.7 5.5 6 .9-4.35 4.25 1.03 6L12 17l-5.38 2.85 1.03-6L3.3 9.6l6-.9L12 3.2Z"/></svg>';
// stack of cards: one more card drawn per completed card (up to 4), and the badge grows a step with every card
const cardStack = n => { const k = Math.min(4, n), w = 14 + (k - 1) * 4;
  return `<svg viewBox="0 0 ${w} 20" style="width:${w * 0.075}em;height:1.15em" aria-hidden="true">${Array.from({ length: k }, (_, i) => `<rect x="${1 + i * 4}" y="${1 + (k - 1 - i) * 1.5}" width="11" height="${17 - (k - 1) * 1.5}" rx="2"/>`).join('')}</svg>`; };
const cardBadge = n => n ? `<span class="cbadge ${tierOf(n) || 'g'}" style="font-size:${Math.min(20, 12 + (n - 1))}px" title="${n} sticker card${n > 1 ? 's' : ''} complete">${cardStack(n)}${n}</span>` : '';
function render(d) {
  stamp(d);
  const pct = d.pace ? Math.round(d.sold / d.pace * 100) : 0;
  const tg = d.todayGoal || 0, tp = tg ? d.today / tg : 0;
  $('hero-today').innerHTML = d.today != null ? `<div class="k">Today · ${new Date(d.asOf || Date.now()).toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' })}</div>
    ${kpi(d)}
    <div class="big"><b>${fmt(d.today)}</b><span>sold today${tg ? ` · ${Math.round(tp * 100)}% of the ${fmt(tg)} day goal` : ''}</span></div>
    ${tg ? `<div class="htrack"><div class="hfill" style="width:${Math.min(100, tp * 100)}%"></div></div><div class="hsub">${d.today >= tg ? '<b>Day goal hit</b> — keep going' : `<b>${fmt(tg - d.today)}</b> to go today`}</div>` : ''}${lyLine(d)}` : '';
  const tday = '';
  $('hero').innerHTML = `<div class="hero-grid"><div class="hero-main"><div class="k">Road to ${fmt(d.goal)} · ${esc(d.month)}</div>
    <div class="big"><b>${fmt(d.sold)}</b><span>sold this month · ${Math.round(d.sold / d.goal * 100)}% of the goal</span></div>
    <div class="htrack"><div class="hfill" style="width:${Math.min(100, d.sold / d.goal * 100)}%"></div><div class="hmark" style="left:${Math.min(100, d.pace / d.goal * 100)}%"></div></div>
    <div class="hsub">We should be at <b>${fmt(d.pace)}</b> by now · the club is at <b>${pct}%</b> of pace</div>
    ${d.mtdLY ? `<div class="hly">Last year to this date: <b>${fmt(d.mtdLY)}</b> · ${d.sold >= d.mtdLY ? `<b>ahead by ${fmt(d.sold - d.mtdLY)}</b> 🎉` : `<b>${fmt(d.mtdLY - d.sold)}</b> behind`}${d.monthLY ? ` · whole month last year: <b>${fmt(d.monthLY)}</b>` : ''}</div>` : ''}
    <div class="leads">${(d.teams || []).filter(t => t.people.length).map(t => `<div class="lead"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4Z"/><path d="M7 6H4v2a3 3 0 0 0 3 3M17 6h3v2a3 3 0 0 1-3 3"/></svg><div><div class="lk">${esc(t.name)}</div><div class="ln">${esc(t.people[0].name)}</div><div class="ls">${fmt(t.people[0].all)} so far this month</div></div></div>`).join('')}${(() => { const all = (d.teams || []).flatMap(t => t.people), top = Math.max(0, ...all.map(p => p.cards || 0)); if (!top) return '';
      const ties = all.filter(p => (p.cards || 0) === top), names = ties.length > 2 ? `${ties.slice(0, 2).map(p => esc(p.name)).join(', ')} +${ties.length - 2}` : ties.map(p => esc(p.name)).join(' & ');
      return `<div class="lead">${STARL}<div><div class="lk">Most sticker cards${ties.length > 1 ? ' · tied' : ''}</div><div class="ln">${names}</div><div class="ls">${top} card${top > 1 ? 's' : ''} complete${ties.length > 1 ? ' each' : ''}</div></div></div>`; })()}</div></div>${tday}</div>`;
  const tl = d.todayPeople || [], mx = tl[0] ? tl[0].today : 1;
  $('todaylist').innerHTML = tl.length ? `<div class="team"><div class="tk">Today · who's adding</div></div><div class="tl">${tl.map((p, i) => `<div class="tl-row ${i === 0 ? 'lead1' : ''}"><span class="tl-r">${i + 1}</span><span class="tl-n">${esc(p.name)}${cardBadge(p.cards)}</span><span class="tl-t">${esc(p.team)}</span><span class="tl-bar"><span style="width:${Math.max(3, p.today / mx * 100)}%"></span></span><span class="tl-v">+${fmt(p.today)}</span>${stkRow(d, p)}</div>`).join('')}</div>${legend(d)}` : '';
  $('teams').innerHTML = (d.teams || []).map(t => {
    const ps = t.people;
    return `<div class="team"><div class="tk">${esc(t.name)}</div>
      <div class="tt">${fmt(t.sold)} <span>of ${fmt(t.target)} this month · ${t.pace ? Math.round(t.sold / t.pace * 100) : 0}% of pace</span>${t.today >= 1 ? `<em class="tt-today">${fmt(t.today)} today</em>` : ''}</div>
      <div class="ttrack"><div class="tfill" style="width:${Math.min(100, t.sold / t.target * 100)}%"></div><div class="tmark" style="left:${Math.min(100, t.pace / t.target * 100)}%"></div></div></div>${!ps.length ? `<div class="cta"><b>Players at the courts are on their own.</b> Go offer drinks, Gatorade, snacks and rackets — every sale there adds to your number and shows on your card as a green “incl. … at Pickleball” tag. ${t.today >= 1 ? `<b>${fmt(t.today)}</b> sold at the courts today.` : '<b>Nothing sold at the courts yet today.</b>'}</div>` : ''}
      ${ps.map((p, i) => {
        const up = ps[i - 1], first = ps[0].name.split(' ')[0];
        const chase = i === 0 ? (ps[1] ? `<b>${fmt(p.all - ps[1].all)} ahead</b> of ${esc(ps[1].name.split(' ')[0])} — keep pushing` : 'Leading')
          : `<b>${fmt(up.all - p.all + 1)} to pass ${esc(up.name.split(' ')[0])}</b>${i > 1 ? ` · ${fmt(ps[0].all - p.all)} behind ${esc(first)}` : ''}`;
        return `<div class="rc ${i === 0 ? 'first' : ''}"><div class="rank ${i < 3 ? 'r' + (i + 1) : ''}">${i + 1}</div><div class="body">
          <div class="top"><span class="name">${esc(p.name)}${cardBadge(p.cards)}</span><span class="amt">${fmt(p.all)}</span></div>
          ${p.today > 0 || (p.elsewhere || []).length ? `<div class="tags">${p.today > 0 ? `<span class="today">+${fmt(p.today)} today</span>` : ''}${(p.elsewhere || []).map(e => `<span class="${e.courts ? 'courts' : 'else'}">incl. ${fmt(e.amt)} ${e.label ? esc(e.label) : 'at ' + esc(e.team)}</span>`).join('')}</div>` : ''}
          <div class="track"><div class="fill ${p.all >= p.byToday ? 'ok' : ''}" style="width:${Math.min(100, p.all / p.goal * 100)}%"></div><div class="mark" style="left:${Math.min(100, p.byToday / p.goal * 100)}%"></div></div>
          <div class="sub"><b>${Math.round(p.all / p.goal * 100)}% of the ${fmt(p.goal)} goal</b> · should be at ${fmt(p.byToday)} by today</div>
          <div class="sub">${chase} · this week ${fmt(p.week)}</div>${monthStk(d, p)}</div></div>`; }).join('')}`;
  }).join('') || '<p class="empty">No sales by person yet this month.</p>';
}
load(); setInterval(load, 2 * 60 * 1000); setInterval(() => { try { stamp(JSON.parse(last)); } catch {} }, 60 * 1000);
setTimeout(() => location.reload(), 3 * 60 * 60 * 1000);
</script>
</body>
